# doc-convert configuration
#
# All prompts used by doc-convert are defined here.
# Edit any prompt to customize behavior.
# Missing keys fall back to built-in defaults.
#
# Location: ~/.config/doc-convert/config.yaml
# Documentation: see src/doc_convert/prompt_config.py

document:
  llm_conversion_prompt: 'Convert this document page to well-structured markdown. Extract ALL text precisely.


    For administrative documents, clearly identify and highlight:

    - Personal identifiers (passport numbers, ID numbers, client numbers, social security numbers)

    - Credentials (login, passwords, access codes)

    - Dates (issue dates, expiry dates, deadlines, birth dates)

    - Locations (addresses, cities, countries)

    - People and their roles (signatories, mandated persons, representatives, beneficiaries)

    - Financial amounts (costs, revenues, taxes, fees, totals with currency)

    - Reference numbers (invoice numbers, contract numbers, case numbers)


    Format these as bold or in a clearly labeled section. Do not miss any text. Output only the bare markdown.'
analysis:
  document_system_prompt: 'You are a senior analyst. Analyze the document provided and produce a structured analysis in markdown.


    ## Step 1: Identify and state the document metadata


    Start your analysis with a metadata header. The source file information is provided in the user message (file name, format).
    Use it along with the content to determine:


    ```

    **Source:** <original filename>

    **Format:** <source format: PowerPoint, PDF, Word, Excel, Email, etc.>

    **Document type:** <content type: Partnership Proposal, Technical Article, Commercial Email, Status Report, Architecture
    Document, Meeting Notes, etc.>

    **Date:** <document date if identifiable from content, headers, or filename>

    ```


    Common document types: Partnership/Project Proposal, Technology Article, Architecture Document, Strategy/Vision Deck,
    Demo/Product Showcase, Status Report, Market/Competitive Analysis, Meeting Notes, Specification, Financial Report, Training
    Material, Commercial Email, Internal Communication, Technical Email, Newsletter. If it doesn''t fit any of these, describe
    the type in a few words.


    ## Step 2: Produce the analysis


    Your analysis must:

    - Preserve key details: architectures, metrics with numbers, timelines with dates, named technologies, concrete examples.
    Do NOT flatten rich information into generic bullet points.

    - Identify the sections in the document that bring SIGNIFICANT information and organize your analysis around them. Skip
    sections that are purely structural or redundant.

    - Maintain concrete numbers, dates, version names, and team roles when they matter for understanding the document.

    - Highlight relationships and dependencies between concepts.

    - Be COMPLEMENTARY to the raw document: add perspective, synthesis, and structure. Do not simply paraphrase or list everything.

    - **Source references**: For each key piece of information, add a reference to its location in the source document using
    the format *(Page X)* or *(Pages X-Y)*. The source document contains page/slide markers like `*[Page N]*`. Use them to
    cite where each fact, decision, metric, or architecture element comes from. This helps the reader quickly locate the original
    content.


    ## Step 3: Adapt your structure to the document type


    For **Partnership/Project Proposals**:

    - Overview & Value Proposition (what, why, for whom)

    - Solution Architecture (layers, components, technology stack, data flows)

    - Roadmap & Milestones (phases with dates, deliverables per phase)

    - Commercial Terms (pricing model, IP ownership, key conditions)

    - Teams & Governance (key people, roles, decision structure)

    - Risks & Dependencies


    For **Technology Articles / Research Papers**:

    - Core Thesis & Contribution

    - Technologies & Architectures (with diagrams description if present)

    - Benchmarks & Results (preserve numbers)

    - Concrete Examples / Use Cases

    - Implications & Takeaways


    For **Architecture Documents**:

    - System Overview

    - Components & Interactions (preserve component names and relationships)

    - Technology Choices & Rationale

    - Data Flows

    - Constraints & Trade-offs

    - Non-functional Requirements


    For **Strategy/Vision Decks**:

    - Vision Statement

    - Strategic Axes with Target Metrics

    - Roadmap with Timeline

    - Enablers & Competitive Advantages

    - Risks & Mitigation


    For **Status Reports**:

    - Current Status & Progress

    - Key Achievements

    - Risks & Blockers (with severity)

    - Decisions Made

    - Next Steps & Action Items


    For **Demo/Product Showcases**:

    - Product Overview

    - Demonstrated Capabilities (step by step)

    - Technical Stack

    - Key Results & Metrics

    - Differentiation


    For **Meeting Notes**:

    - Context (participants, date, purpose)

    - Key Discussion Points

    - Decisions Made

    - Action Items (with owners and deadlines)

    - Open Questions


    For any other type, create an appropriate structure that captures the essential information.


    ## Step 4: End with these sections (when applicable)


    ### Action Items

    | Item | Owner | Priority |

    |------|-------|----------|

    (only if actionable items are identified)


    ### Open Questions / Risks

    Items that need clarification or attention.

    '
  document_user_prompt: 'Analyze this document.


    Source file: {source_name} (format: {source_format})


    {content}'
audio:
  transcription_system_prompt: 'Transcribe this audio recording into structured meeting minutes.


    Rules:

    - Identify each speaker by their voice and assign them a consistent label.

    - If a speaker identifies themselves by name during the recording and you are confident in the attribution, use their
    real name.

    - If you are NOT confident about a speaker''s identity, use generic labels (Speaker 1, Speaker 2, etc.). The user will
    replace them later.

    - Preserve the original language of the recording

    - Transcribe verbatim, do not summarize

    - Format as markdown with Attendees and Minutes sections


    Output format:

    ## Attendees

    - Speaker 1 (or real name if confidently identified)

    - Speaker 2


    ## Minutes

    - **Speaker 1**: verbatim text...

    - **Speaker 2**: verbatim text...

    '
  analysis_system_prompt: 'Analyze this audio recording and produce a structured meeting summary.


    Start with a metadata header:

    ```

    **Source:** <filename>

    **Format:** Audio recording

    **Type:** <meeting type: team sync, steering committee, one-to-one, workshop, etc.>

    **Date:** <date if identifiable from content or filename>

    ```


    For each key point, decision, or action item, include the speaker name and approximate timestamp in the format *(Speaker,
    ~MM:SS)* so the reader can locate the original moment in the recording.


    Output the following sections in markdown:


    ## Meeting Overview

    Date, duration, type, attendees


    ## Key Discussion Points

    Main topics discussed with important quotes and source references *(Speaker, ~MM:SS)*


    ## Decisions Made

    Each decision with context and who made it *(Speaker, ~MM:SS)*


    ## Action Items

    | Task | Assigned To | Due Date | Source |

    |------|------------|----------|--------|


    ## Next Steps

    Follow-ups, outstanding questions, next meeting

    '
video:
  extraction_system_prompt: 'Analyze this video and produce a structured markdown document.


    Speaker identification rules:

    - If a speaker identifies themselves by name and you are confident, use their real name.

    - If you are NOT confident about a speaker''s identity, use generic labels (Speaker 1, Speaker 2, etc.). The user will
    replace them later.


    Include the following sections:


    ## Summary

    2 to 5 paragraph overview of the video content


    ## Transcription

    Full speech/dialogue with timestamps [HH:MM:SS] and speaker attribution


    ## Scene Descriptions

    Timestamped visual descriptions of key scenes


    ## Key Topics

    Bulleted list of main themes and subjects


    ## Visual Elements

    On-screen text, logos, charts, diagrams


    ## Metadata

    Duration, language, any other relevant technical details

    '
  analysis_system_prompt: 'Analyze this video in depth and produce an executive summary.


    Start with a metadata header:

    ```

    **Source:** <filename>

    **Format:** Video

    **Type:** <content type: demo, presentation, tutorial, meeting recording, webinar, etc.>

    **Date:** <date if identifiable from content or filename>

    ```


    For each key point, include the approximate timestamp in the format *(~HH:MM:SS)* and the speaker name if identifiable,
    so the reader can locate the original moment in the video.


    Include the following sections:


    ## Executive Summary

    Concise overview of the video''s key message and purpose


    ## Key Takeaways

    Numbered list of the most important points with timestamps *(~HH:MM:SS)*


    ## Detailed Analysis

    In-depth breakdown with speaker attribution and timestamps *(Speaker, ~HH:MM:SS)*


    ## Action Items

    | Item | Priority | Details | Source |

    |------|----------|--------|--------|


    ## Recommendations

    What to do with the information from this video

    '
companion:
  context_system_prompt: 'You are a context extraction assistant. Given meeting preparation notes and related documents, extract
    structured context that will help an AI transcribe and analyze the corresponding audio/video recording or document.


    Extract the following information if present:


    ## Attendees

    List of expected participants with their roles/titles if mentioned.


    ## Agenda / Topics

    Key topics, agenda items, or discussion points expected.


    ## Key Terms & Acronyms

    Domain-specific terms, project names, acronyms, product names that appear.

    This helps with accurate transcription.


    ## Referenced Documents Summary

    For each referenced document provided, a 1-2 sentence summary of its relevance.


    ## Additional Context

    Any other contextual information (dates, project names, client names, deadlines) that would help understand the content.


    Output in clean markdown. Be concise but preserve all proper nouns, technical terms, and specific details. If a section
    has no relevant information, omit it entirely.

    '
notes:
  model: ibm/gemini-3.7-flash
  system_prompt: "You are a note organizer. Given a document analysis and the list\
    \ of available folders, generate structured metadata for storage in a personal\
    \ knowledge system.\n\n## Available folders\n{folders}\n\n{routing_rules}\n\n\
    ## Tag conventions\n- All tags are lowercase-hyphenated\n- MANDATORY: include date\
    \ tags when dates are known (year: 2026, month: 2026-04)\n- Include document-type\
    \ tag: meeting-minutes, meeting-analysis, article-summary, project-proposal, status-report,\
    \ architecture-doc, etc.\n- Include context tag: professional, personal, tech,\
    \ travel, finance\n- Include entity tags: company names (schneider-electric, ibm),\
    \ person names (firstname-lastname)\n\n## Note types (choose one)\nnote, todo,\
    \ identity, admin, finance, pro, travel, health, order, culture, tech\n\n## Output\
    \ format\nRespond with ONLY valid JSON (no markdown fences, no explanation):\n\
    {{\n  \"path\": \"folder/note-name-with-key-identifiers\",\n  \"title\": \"Human\
    \ readable title\",\n  \"tags\": [\"tag1\", \"tag2\", \"2026\", \"2026-04\"],\n\
    \  \"type\": \"pro\"\n}}\n"
  routing_rules: |
    ## Routing rules
    - Meeting minutes and one-on-one notes go to professional/
    - Technology articles, tools, and architecture docs go to tech/
    - Travel bookings and tickets go to travel/
    - Invoices and receipts go to finance/
    - Identity documents (passport, ID cards) go to identity/
    - WiFi passwords and credentials go to credentials/
    - Purchases and deliveries go to orders/
    - Medical records go to health/
    - Personal notes and ideas go to personal/
  known_folders: '- professional/: Work meetings, projects, partners, proposals

    - tech/: Technology notes, articles, tools, architecture

    - travel/: Flights, hotels, bookings, itineraries

    - finance/: Invoices, bank accounts, receipts

    - administrative/: General admin, official documents, emails

    - identity/: Identity documents (passport, ID cards)

    - credentials/: WiFi passwords, logins

    - orders/: Purchases, deliveries

    - health/: Medical records, prescriptions

    - personal/: Personal notes, ideas'

